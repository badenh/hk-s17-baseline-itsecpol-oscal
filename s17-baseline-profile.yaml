    remarks: Every policy statement in sections 7 to 20 of S17, the fourteen security areas section 2.1
      enumerates. S17 defines no assurance levels or system tiers to select between, so this profile is
      the whole policy and is the profile to assess against. 136 of the 142 statements are mandatory under
      section 4.2's 'shall'; five are best practice under 'should' and one uses no convention word. Each
      control records which, as props[name=conformance] — the catalog marks the distinction rather than
      profiling on it.
