  metadata:
    title: Baseline IT Security Policy (S17)
    published: '2025-04-01T00:00:00+08:00'
    last-modified: '2025-04-01T00:00:00+08:00'
    version: '8.2'
    oscal-version: 1.2.3
    document-ids:
    - scheme: https://www.govcert.gov.hk/
      identifier: S17
    props:
    - name: keywords
      value: Hong Kong, HKSAR, baseline, IT security policy, S17, government, ISO/IEC 27001, ISO/IEC 27002
    links:
    - href: https://www.govcert.gov.hk/doc/S17_EN.pdf
      rel: canonical
      media-type: application/pdf
    roles:
    - id: ismc
      title: Information Security Management Committee
      short-name: ISMC
      description: 'A central organisation, the Information Security Management Committee (ISMC), was
        established in April 2000 to oversee IT security within the whole Government. The Committee meets
        on a regular basis to:


        * Review and endorse changes to the government IT security related regulations, policies and guidelines;


        * Define specific roles and responsibilities relating to IT security; and


        * Provide guidance and assistance to B/Ds in the enforcement of IT security related regulations,
        policies, and guidelines through the IT Security Working Group (ITSWG).


        The core members of ISMC comprise representatives from:


        * Digital Policy Office (DPO)


        * Security Bureau (SB)


        Representative(s) from other B/Ds will be co-opted into the committee on a need basis in relation
        to specific subject matters. DPO will assist in reviewing and clarifying the documents submitted
        by B/Ds as required in this document.'
      props:
      - name: source-clause
        value: section 5.1.1
    - id: itswg
      title: IT Security Working Group
      short-name: ITSWG
      description: 'The IT Security Working Group (ITSWG) serves as the executive arm of the ISMC in the
        promulgation and compliance monitoring of government IT security related regulations, policies
        and guidelines. The ITSWG was established in May 2000, and its responsibilities are to:


        * Co-ordinate activities aimed at providing guidance and assistance to B/Ds in the enforcement
        of IT security related regulations, policies and guidelines;


        * Monitor the compliance with the Baseline IT Security Policy at B/Ds;


        * Define and review the IT security related regulations, policies and guidelines; and


        * Promote IT security awareness within the Government.


        The core members of ITSWG comprise representatives from:


        * Digital Policy Office (DPO)


        * Security Bureau (SB)


        * Hong Kong Police Force (HKPF)


        * Chief Secretary for Administration’s Office (CSO)


        Representative(s) from other B/Ds will be co-opted into the working group on a need basis, in
        relation to specific subject matters.'
      props:
      - name: source-clause
        value: section 5.1.2
    - id: giro
      title: Government Information Security Incident Response Office
      short-name: GIRO
      description: 'To handle information security incidents occurring in B/Ds, an Information Security
        Incident Response Team (ISIRT) shall be established in each B/D. The Government Information Security
        Incident Response Office (GIRO) provides central co-ordination and support to the operation of
        individual ISIRTs of B/Ds. The GIRO Standing Office serves as the executive arm of GIRO.


        The GIRO has the following major functions:


        * Maintain a central inventory and oversee the handling of all information security incidents
        in the Government;


        * Prepare periodic statistics reports on government information security incidents;


        * Act as a central office to co-ordinate the handling of multiple-point security attacks (i.e.
        simultaneous attacks on different government information systems); and


        * Enable experience sharing and information exchange related to information security incident
        handling among ISIRTs of different B/Ds.


        The core members of GIRO comprise representatives from:


        * Digital Policy Office (DPO)


        * Security Bureau (SB)


        * Hong Kong Police Force (HKPF)'
      props:
      - name: source-clause
        value: section 5.1.3
    - id: govcert-hk
      title: Government Computer Emergency Response Team Hong Kong
      short-name: GovCERT.HK
      description: 'The Government Computer Emergency Response Team Hong Kong (GovCERT.HK) was established
        in April 2015. In addition to collaborating with GIRO Standing Office in co-ordinating information
        and cyber security incidents within the Government, it also collaborates with the computer emergency
        response team community in sharing incident information and threat intelligence, and exchanging
        best practices to strengthen information and cyber security capabilities in the region. GovCERT.HK
        has the following major functions:


        * Disseminate security alerts on impending and actual threats to B/Ds; and


        * Act as a bridge between the Hong Kong Computer Emergency Response Team Coordination Centre (HKCERT)
        and other computer security incident response teams (CSIRT) in handling cyber security incidents.'
      props:
      - name: source-clause
        value: section 5.1.4
    - id: bureaux-departments
      title: Bureaux/Departments
      description: 'B/Ds shall be responsible for the security protection of their information assets
        and information systems. The roles and responsibilities of IT security staff within a B/D are
        detailed in Section 5.2 - Departmental IT Security Organisation.


        5.2. Departmental IT Security Organisation


        This section explains the individual roles and responsibilities of a departmental IT security
        organisation. In order to have sufficient segregation of duties, multiple roles should not be
        assigned to an individual unless there is a resource limitation.


        The following diagram describes a sample departmental IT security management framework:


        An Example Organisation Chart for Departmental IT Security Management 1'
      props:
      - name: source-clause
        value: section 5.1.5
    - id: ditso
      title: Departmental IT Security Officer
      short-name: DITSO
      description: 'Head of B/D shall appoint an officer at D3 level or above from the senior management
        to be the Departmental IT Security Officer (DITSO) and responsible for IT security. As the senior
        management of the B/D, the DITSO shall participate in the overall steering of IT security matters
        of the B/D. The DITSO shall also understand the B/D’s priorities, the importance of the B/D’s
        information systems and data assets, and the level of security that shall be achieved.


        If a B/D does not have a directorate officer at D3 level or above, the highest rank


        directorate officer of the B/D shall assume the position of DITSO so as to uphold the principle
        of ensuring accountability in IT security.


        SB and DPO will provide training to DITSOs to facilitate them in carrying out their duties and
        DITSOs shall attend the designated training. The roles and responsibilities of DITSO shall be
        clearly defined, which include but are not limited to the following:


        * Establish and maintain an information protection program to assist all staff in the protection
        of the information and information systems they use;


        * Establish a proper security governance process to evaluate, direct, monitor and communicate
        the IT security related activities within the B/D;


        * Drive regular discussions on IT security issues at the senior management level to acquire adequate
        support and resources;


        * Lead in the establishment, maintenance and implementation of IT security policies, standards,
        procedures and guidelines;


        * Oversee, monitor, review and improve the effectiveness and efficiency of IT security management
        throughout every stage of IT operations;


        * Monitor and ensure compliance with the government IT security requirements, including overseeing
        the satisfactory completion of security audit exercises of the B/D;


        * Oversee the overall IT security awareness and training programmes within the B/D;


        * Co-ordinate with other B/Ds on IT security issues;


        * Oversee the overall IT risk management process within the B/D, including overseeing the satisfactory
        completion of information security risk assessments and privacy impact assessments as well as
        subsequent rectifications and responding to the evolving risk landscape, regulatory changes, technological
        advancements, and the system criticality;


        * Oversee the IT security threat detection and monitoring process and the threat intelligence
        activities of the B/D, including dissemination of security alerts on impending and actual threats
        from the GIRO to responsible parties within the B/D and relevant project teams; and


        * Initiate investigation and rectification in case of breach of security and co-ordinate the required
        submission of incident reports to the Director of Bureau.'
      props:
      - name: source-clause
        value: section 5.2.1
    - id: information-security-steering-committee
      title: Information Security Steering Committee
      description: 'The senior management of B/Ds shall have an appreciation of IT security, its problems
        and resolutions. Senior management should consider setting up of an information security steering
        committee which reports to DITSO, or including information security as one of the regular discussion
        items in management meetings. The responsibilities of the committee include:


        * Demonstrate leadership in promoting and prioritising IT security within the B/D;


        * Direct and enforce the development of security measures;


        * Provide the necessary resources required for the measures to be implemented;


        * Foster the proper, orderly and secure functioning of all information systems of the B/D;


        * Ensure participation and accountability at all levels of management, administrative, technical
        and operational staff, and provide full support to them;


        * Foster a culture of security awareness and accountability throughout the B/D; and


        * Ensure B/D’s IT security strategies align with the business objectives.


        If B/Ds choose not to set up an information security steering committee, DITSO should undertake
        the responsibilities of the committee.'
      props:
      - name: source-clause
        value: section 5.2.2
    - id: dso
      title: Departmental Security Officer
      short-name: DSO
      description: 'The Head of B/D will designate a Departmental Security Officer (DSO) to perform the
        departmental security related duties. The DSO will take the role of an executive to:


        * Discharge responsibilities for all aspects of security for the B/D; and


        * Advise on the set up and review of the security policy.


        The DSO may take on the role of the DITSO. Alternatively, in those B/Ds where someone else is
        appointed, the DITSO shall collaborate with the DSO to oversee the IT security of the B/D.'
      props:
      - name: source-clause
        value: section 5.2.3
    - id: isirt-commander
      title: Departmental Information Security Incident Response Team (ISIRT) Commander
      short-name: ISIRT
      description: 'The ISIRT is the central focal point for co-ordinating the handling of information
        security incidents occurring within the respective B/D. The Head of B/D should designate an officer
        from the senior management to be the ISIRT Commander. The ISIRT Commander should have the authority
        to appoint core team members for the ISIRT. The responsibilities of an ISIRT Commander include:


        * Provide overall supervision and co-ordination of information security incident handling for
        all information systems within the B/D;


        * Make decisions on critical matters such as damage containment, system recovery, the engagement
        of external parties and the extent of involvement, and service resumption logistics after recovery;


        * Trigger the departmental disaster recovery procedure where appropriate, depending on the impact
        of the incident on the business operation of the B/D;


        * Provide management endorsement on the provision of resources for the incident handling process;


        * Provide management endorsement in respect of the line-to-take for publicity on the incident;


        * Collaborate with GIRO in reporting information security incidents for central


        recording and necessary follow-up actions; and


        * Facilitate experience and information sharing within the B/D on information security incident
        handling and related matters.'
      props:
      - name: source-clause
        value: section 5.2.4
    - id: it-security-management-unit
      title: IT Security Management Unit
      description: 'B/Ds shall establish an IT security management unit which reports to DITSO and assists
        DITSO in discharging his/her duties. The size and composition of the unit may vary among B/Ds
        depending on the business and operational needs of B/Ds. The responsibilities of the IT security
        management unit include:


        * Assist DITSO in overseeing the security governance process for the IT security related activities
        within the B/D;


        * Assist DITSO in the IT security management process for all IT operations of the B/D;


        * Assist DITSO in developing, establishing, and maintaining the overall IT security strategy and
        roadmap for the B/D, including formulating IT security policies, baselines, standards, directives,
        etc.;


        * Co-ordinate security awareness and training programmes within the B/D;


        * Co-ordinate the implementation of IT security initiatives and monitor the status of IT security
        processes to ensure the effectiveness of IT security management and compliance with government
        security requirements;


        * Facilitate IT security threat and risk management activities and support disaster recovery and
        business continuity planning functions relating to IT security;


        * Co-ordinate security incident investigation and rectification;


        * Liaise with other B/Ds and parties on IT security matters; and


        * Perform any other duties as directed by the DITSO.


        5.3. Other Roles'
      props:
      - name: source-clause
        value: section 5.2.5
    - id: it-security-administrators
      title: IT Security Administrators
      description: 'IT Security Administrators shall be responsible for providing security and risk management
        related support services. His/her responsibilities also include:


        * Assist in identifying and mitigating system vulnerabilities;


        * Assist in the patch management process;


        * Conduct security administrative tasks, such as implementing access controls and managing user
        privileges;


        * Maintain and review audit logs;


        * Monitor threat intelligence sources and stay updated on emerging security threats; and


        * Operate and maintain security tools and systems, such as intrusion detection and prevention
        systems.


        The IT Security Administrator should not be the same person as the System Administrator. There
        should be a segregation of duties between the IT Security Administrator and the System Administrator.


        Although the IT Security Administrators are responsible for managing the audit logs, they should
        not tamper with or change any audit log.


        B/Ds may appoint an IT Security Auditor, who will be responsible for auditing the work of the
        IT Security Administrators to ensure that they perform their duties due diligently.'
      props:
      - name: source-clause
        value: section 5.3.1
    - id: information-owners
      title: Information Owners
      description: 'Information Owners shall be the collators and the owners of information stored in
        information systems. Their primary responsibility is to:


        * Determine the data classifications, the authorised data usage, and the corresponding security
        requirements for protection of the information.'
      props:
      - name: source-clause
        value: section 5.3.2
    - id: lan-system-administrators
      title: LAN/System Administrators
      description: 'LAN/System Administrators shall be responsible for the day-to-day administration,
        operation and configuration of the computer systems and network in B/Ds, whereas Internet System
        Administrators are responsible for the related tasks for their Internet-facing information systems.
        Their responsibilities include:


        * Implement the security mechanisms and controls in accordance with procedures/guidelines established
        by the DITSO.'
      props:
      - name: source-clause
        value: section 5.3.3
    - id: application-development-maintenance-team
      title: Application Development & Maintenance Team
      description: 'The Application Development & Maintenance Team shall be responsible for producing
        quality systems with the use of quality procedures, techniques and tools. Their responsibilities
        include:


        * Liaise with the Information Owner in order to define and implement system security requirements
        during the development and maintenance of applications; and


        * Ensure quality procedures, techniques, and tools are used to produce secure systems.'
      props:
      - name: source-clause
        value: section 5.3.4
    - id: users
      title: Users
      description: 'Users of information systems shall be the staff authorised to access and use the information.
        Users shall be accountable for all their activities. Responsibilities of a user include:


        * Attend security awareness and training programmes directed by the B/D;


        * Know, understand, follow and apply all the possible and available security mechanisms to the
        maximum extent possible;


        * Prevent leakage and unauthorised access to information under his/her custody; and


        * Safekeep computing and storage devices, and protect them from unauthorised access or malicious
        attack with his/her best effort.'
      props:
      - name: source-clause
        value: section 5.3.5
