    remarks: 'Unofficial OSCAL rendering of the Baseline IT Security Policy [S17] version 8.2, published
      by the Digital Policy Office of the Government of the Hong Kong Special Administrative Region. Controls
      are the numbered policy statements of sections 7 to 20 — the fourteen mandatory security areas listed
      in section 2.1 — one control per statement, grouped by section and subsection. Control titles are
      editorial: the source document numbers its statements and does not name them; every control carries
      a `title-source` prop recording whether its title came from the conversion''s reviewed title map
      or from an automatic derivation. Sections 5.1 to 5.3 supply metadata.roles; section 3 and section
      2.3 supply back-matter resources; section 4.1 supplies the definitions group. This is not an official
      publication and is not endorsed by the Digital Policy Office.'
  groups:
  - id: s17-definitions
    class: front-matter
    title: Definitions
    props:
    - name: label
      value: 4.1.
    parts:
    - id: s17-definitions_ovw
      name: overview
      prose: Terms as defined in section 4.1 of the source document. This group carries no controls; it
        exists so that consumers of the catalog have the document's own vocabulary alongside its requirements.
    - id: s17-definitions_a
      name: definition
      title: Tier 1 Information Systems
      prose: A related set of hardware and software organised for the collection, processing, storage,
        communication, or disposition of information, regardless of the source of funding and project
        type.
    - id: s17-definitions_b
      name: definition
      title: Tier 2 Information Systems
      prose: Tier 1 information systems which are crucial to the operations of the Government or society
        and whose failure or disruption will result in a serious impact on government operations or may
        cause public turmoil and catastrophes.
    - id: s17-definitions_c
      name: definition
      title: Essential Services
      prose: Services that are critical to the functioning and security of a society and its economy.
    - id: s17-definitions_d
      name: definition
      title: Tier 3 Information Systems
      prose: Tier 2 information systems which are directly related to the provision of essential service
        concerned and whose disruption or destruction may cause serious harm to the economy, people’s
        livelihood, public safety, etc.
    - id: s17-definitions_e
      name: definition
      title: Confidentiality
      prose: Only authorised persons and information systems are allowed to know or gain access to the
        information stored or processed by information systems in any aspect.
    - id: s17-definitions_f
      name: definition
      title: Integrity
      prose: Only authorised persons and information systems are allowed to make changes to the information
        stored or processed by information systems in any aspect.
    - id: s17-definitions_g
      name: definition
      title: Availability
      prose: Information System is accessible and usable upon demand by authorised persons and information
        systems.
    - id: s17-definitions_h
      name: definition
      title: IT Security Policy
      prose: A documented list of management instructions that describes in detail the proper use and
        management of computer and network resources with the objective of protecting these resources,
        as well as the information stored or processed by information systems, from any unauthorised disclosure,
        modifications or destruction.
    - id: s17-definitions_i
      name: definition
      title: Classified Information
      prose: Refers to the categories of information classified in accordance with the Security Regulations.
    - id: s17-definitions_j
      name: definition
      title: Staff
      prose: A collective term used to describe all personnel employed or whose service is acquired to
        work for the Government, including all public officers irrespective of the employment period and
        terms, non-government secondees engaged through employment agencies, and other term contract services
        personnel, etc., who may have different accessibility to classified information and are subject
        to different security vetting requirements. Specific requirements governing human resource security
        are found in Section 9 of S17.
    - id: s17-definitions_k
      name: definition
      title: Data Centre
      prose: A centralised data processing facility that houses information systems and related equipment.
    - id: s17-definitions_l
      name: definition
      title: Computer Room
      prose: A dedicated room for housing computer equipment.
    - id: s17-definitions_m
      name: definition
      title: Malware
      prose: Programs intended to perform an unauthorised process that will have an adverse impact on
        the confidentiality, integrity, or availability of an information system. Examples of malware
        include computer viruses, worms, Trojan horses, and spyware.
    - id: s17-definitions_n
      name: definition
      title: Mobile Devices
      prose: Portable computing and communication devices with information storage and processing capability.
        Examples include portable computers, mobile phones, tablets, digital cameras, and audio or video
        recording devices.
    - id: s17-definitions_o
      name: definition
      title: Removable Media
      prose: Portable electronic storage media such as magnetic, optical, and flash memory devices, which
        can be inserted into and removed from a computing device. Examples include external hard drives
        or solid-state drives, floppy disks, zip drives, optical disks, tapes, memory cards, flash drives,
        and similar USB storage devices.
    - id: s17-definitions_p
      name: definition
      title: Internet of Things (IoT) Devices
      prose: Devices that have network connectivity and computing capabilities, which function autonomously
        to interact with the physical environment by ways of sensing or actuation.
  - id: s17-7
    class: security-area
    title: Management Responsibilities
    props:
    - name: label
      value: '7.'
    parts:
    - id: s17-7_ovw
      name: overview
      prose: Head of B/Ds shall put in place effective security arrangements to ensure information systems
        and data assets of the Government are safeguarded, and IT services are delivered securely.
    groups:
    - id: s17-7.1
      class: topic
      title: General Management
      props:
      - name: label
        value: 7.1.
      controls:
      - id: s17-7.1.1
        class: policy-statement
        title: Departmental IT security organisational framework
        props:
        - name: label
          value: 7.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-7.1.1_smt
          name: statement
          prose: B/Ds shall define their departmental IT security organisational framework and the associated
            roles and responsibilities.
      - id: s17-7.1.2
        class: policy-statement
        title: Responsive and adaptive security protection
        props:
        - name: label
          value: 7.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-7.1.2_smt
          name: statement
          prose: B/Ds shall ensure that security protection is responsive and adaptive to changing environments
            and technology.
      - id: s17-7.1.3
        class: policy-statement
        title: Segregation of security duties
        props:
        - name: label
          value: 7.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-7.1.3_smt
          name: statement
          prose: B/Ds shall apply sufficient segregation of duties to avoid the execution of all security
            functions of an information system by a single individual.
      - id: s17-7.1.4
        class: policy-statement
        title: Budget provision for security safeguards
        props:
        - name: label
          value: 7.1.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-7.1.4_smt
          name: statement
          prose: B/Ds shall ensure that the provision for necessary security safeguards and resources
            are covered in their budgets.
      - id: s17-7.1.5
        class: policy-statement
        title: Right to examine government-held information
        props:
        - name: label
          value: 7.1.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        links:
        - href: '#61da519c-33af-5e87-b582-aa1c5cef5db9'
          rel: reference
        parts:
        - id: s17-7.1.5_smt
          name: statement
          prose: B/Ds shall reserve the right to examine all information stored in or transmitted by government
            information systems in compliance with the Personal Data (Privacy) Ordinance.
    - id: s17-7.2
      class: topic
      title: Security Risk Management
      props:
      - name: label
        value: 7.2.
      controls:
      - id: s17-7.2.1
        class: policy-statement
        title: Risk-based approach to information security
        props:
        - name: label
          value: 7.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-7.2.1_smt
          name: statement
          prose: B/Ds shall adopt a risk-based approach to information security to ensure the confidentiality,
            integrity and availability of information assets and all other security aspects of information
            systems under their control, including outsourced systems, and monitor compliance with the
            security policies, guidelines, etc., by their staff and contractors.
      - id: s17-7.2.2
        class: policy-statement
        title: Classified protection and system classification
        props:
        - name: label
          value: 7.2.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-7.2.2_smt
          name: statement
          prose: B/Ds shall adopt classified protection of IT security by assessing the classifications
            of all their information systems, including infrastructure facilities and departmental shared
            IT services, regardless of the source of their funding and implementing tiered security controls
            according to the system classifications. The assessment details of system classification of
            all information systems shall be properly documented. The information system classifications
            shall be endorsed by the Heads of B/Ds or their explicitly delegated officer at directorate
            level.
  - id: s17-8
    class: security-area
    title: IT Security Policies
    props:
    - name: label
      value: '8.'
    parts:
    - id: s17-8_ovw
      name: overview
      prose: B/Ds shall define and enforce their IT security policies to provide management direction
        and support for protecting information systems and assets in accordance with the business needs
        and security requirements.
    groups:
    - id: s17-8.1
      class: topic
      title: Management Direction for IT Security
      props:
      - name: label
        value: 8.1.
      controls:
      - id: s17-8.1.1
        class: policy-statement
        title: Departmental IT security policy
        props:
        - name: label
          value: 8.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-8.1.1_smt
          name: statement
          prose: B/Ds shall promulgate and enforce their own IT Security Policy. They shall use the Baseline
            IT Security Policy document as a basis for their policy development.
      - id: s17-8.1.2
        class: policy-statement
        title: Periodic review of security policies and procedures
        props:
        - name: label
          value: 8.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-8.1.2_smt
          name: statement
          prose: B/Ds shall conduct a review of their information security policies, standards, procedures
            and guidelines periodically.
      - id: s17-8.1.3
        class: policy-statement
        title: Acceptable use policy for IT services and facilities
        props:
        - name: label
          value: 8.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-8.1.3_smt
          name: statement
          prose: B/Ds shall clearly define and communicate to users its policy in relation to acceptable
            use of IT services and facilities.
  - id: s17-9
    class: security-area
    title: Human Resource Security
    props:
    - name: label
      value: '9.'
    parts:
    - id: s17-9_ovw
      name: overview
      prose: B/Ds shall ensure that staff who are engaged in government work are suitable for the roles,
        understand their responsibilities and are aware of information security risks. B/Ds shall protect
        the government interests in the process of new, changing or terminating employment.
    groups:
    - id: s17-9.1
      class: topic
      title: New, During or Termination of Employment
      props:
      - name: label
        value: 9.1.
      controls:
      - id: s17-9.1.1
        class: policy-statement
        title: Notification of IT security responsibilities
        props:
        - name: label
          value: 9.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-9.1.1_smt
          name: statement
          prose: B/Ds shall advise all staff of their IT security responsibilities upon being assigned
            a new post and periodically throughout their term of employment.
      - id: s17-9.1.2
        class: policy-statement
        title: Security awareness training
        props:
        - name: label
          value: 9.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-9.1.2_smt
          name: statement
          prose: Information security is the responsibility of every member of the staff in the Government.
            Staff shall receive appropriate awareness training and regular updates on the IT Security
            Policy.
      - id: s17-9.1.3
        class: policy-statement
        title: Periodic staff education and training
        props:
        - name: label
          value: 9.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-9.1.3_smt
          name: statement
          prose: Staff shall be educated and trained periodically in order to enable them to discharge
            their responsibilities and perform their duties relating to IT security.
      - id: s17-9.1.4
        class: policy-statement
        title: Integrity checks and background verification
        props:
        - name: label
          value: 9.1.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: should
        parts:
        - id: s17-9.1.4_smt
          name: statement
          prose: Civil servants authorised to access classified information higher than RESTRICTED shall
            undergo an integrity check as stipulated by the Secretary for the Civil Service. For staff
            other than civil servants, appropriate background verification checks should be carried out
            commensurate with the business requirements, the classification of the information that the
            staff will handle, and the perceived risks.
      - id: s17-9.1.5
        class: policy-statement
        title: Disciplinary provisions for civil servants
        props:
        - name: label
          value: 9.1.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: may
        links:
        - href: '#21771954-751c-5223-9d05-b0962796bbc2'
          rel: reference
        parts:
        - id: s17-9.1.5_smt
          name: statement
          prose: B/Ds shall include in their IT Security Policy a provision advising civil servants that
            if they contravene any provision of the Policy, they may be subjected to disciplinary action
            as stipulated in the Civil Service Regulations and that different levels of disciplinary action
            may be instigated depending on the severity of the breach.
      - id: s17-9.1.6
        class: policy-statement
        title: Penalty provisions for non-civil-service staff
        props:
        - name: label
          value: 9.1.6.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: may
        parts:
        - id: s17-9.1.6_smt
          name: statement
          prose: B/Ds shall include in their IT Security Policy a provision advising all staff other than
            civil servants which shall be covered in 9.1.5 above, that if they contravene any provision
            of the Policy, they may be subject to relevant penalty action according to their respective
            terms of employment, including but not limited to termination of their services to the Government,
            depending on the severity of the breach.
      - id: s17-9.1.7
        class: policy-statement
        title: Selection and authorisation of staff with system access
        props:
        - name: label
          value: 9.1.7.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-9.1.7_smt
          name: statement
          prose: Staff who use or have unescorted access to information systems and resources shall be
            carefully selected and they shall be made aware of their own responsibilities and duties.
            They shall be formally notified of their authorisation to access information systems.
      - id: s17-9.1.8
        class: policy-statement
        title: Disclosure of classified information and the need-to-know principle
        props:
        - name: label
          value: 9.1.8.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: should
        parts:
        - id: s17-9.1.8_smt
          name: statement
          prose: No staff shall publish, make private copies of or communicate to unauthorised persons
            any classified document or information obtained in his official capacity, unless he is required
            to do so in the interest of the Government. The "need to know" principle shall be applied
            to all classified information, which should be provided only to persons who require it for
            the efficient discharge of their work and who have authorised access. If in any doubt as to
            whether an officer has authorised access to a particular document or classification or information,
            the Departmental Security Officer should be consulted.
      - id: s17-9.1.9
        class: policy-statement
        title: Responsibilities surviving termination or change of employment
        props:
        - name: label
          value: 9.1.9.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-9.1.9_smt
          name: statement
          prose: Information security responsibilities and duties that remain valid after termination
            or change of employment shall be defined, communicated to the staff and enforced.
  - id: s17-10
    class: security-area
    title: Asset Management
    props:
    - name: label
      value: '10.'
    parts:
    - id: s17-10_ovw
      name: overview
      prose: B/Ds shall maintain appropriate protection of all hardware, software and information assets
        and ensure all information systems and assets receive an appropriate level of protection.
    groups:
    - id: s17-10.1
      class: topic
      title: Responsibility for Assets
      props:
      - name: label
        value: 10.1.
      controls:
      - id: s17-10.1.1
        class: policy-statement
        title: Inventory of systems, assets, warranties and agreements
        props:
        - name: label
          value: 10.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-10.1.1_smt
          name: statement
          prose: B/Ds shall ensure that an inventory of information systems, hardware assets, software
            assets, valid warranties, service agreements and legal/contractual documents are properly
            owned, kept and maintained.
      - id: s17-10.1.2
        class: policy-statement
        title: Disclosure of information about information systems
        props:
        - name: label
          value: 10.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: may
        parts:
        - id: s17-10.1.2_smt
          name: statement
          prose: Information about information systems shall not be disclosed where that information may
            compromise the security of those systems, except on a need-to-know basis and only if authorised
            by the DITSO.
      - id: s17-10.1.3
        class: policy-statement
        title: Disclosure of system location and controls by staff
        props:
        - name: label
          value: 10.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-10.1.3_smt
          name: statement
          prose: Staff shall not disclose to any unauthorised persons the nature and location of the information
            systems and the information system controls that are in use or the way in which they are implemented.
      - id: s17-10.1.4
        class: policy-statement
        title: Handover and return of resources on departure
        props:
        - name: label
          value: 10.1.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-10.1.4_smt
          name: statement
          prose: At the time that a member of the staff is transferred or ceases to provide services to
            the Government, the outgoing officer or staff of external parties shall handover and return
            computer resources and information to the Government.
    - id: s17-10.2
      class: topic
      title: Information Classification
      props:
      - name: label
        value: 10.2.
      controls:
      - id: s17-10.2.1
        class: policy-statement
        title: Information classification, labelling and handling
        props:
        - name: label
          value: 10.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-10.2.1_smt
          name: statement
          prose: B/Ds shall comply with the government security requirements in relation to the information
            classification, labelling and handling.
      - id: s17-10.2.2
        class: policy-statement
        title: Encryption of classified information in storage
        props:
        - name: label
          value: 10.2.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-10.2.2_smt
          name: statement
          prose: All classified information shall be encrypted in storage irrespective of the storage
            media.
    - id: s17-10.3
      class: topic
      title: Storage Media Handling
      props:
      - name: label
        value: 10.3.
      controls:
      - id: s17-10.3.1
        class: policy-statement
        title: Use and transportation of storage media
        props:
        - name: label
          value: 10.3.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-10.3.1_smt
          name: statement
          prose: B/Ds shall manage the use and transportation of storage media containing classified information.
      - id: s17-10.3.2
        class: policy-statement
        title: Protection of storage media holding classified information
        props:
        - name: label
          value: 10.3.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-10.3.2_smt
          name: statement
          prose: Storage media with classified information shall be protected against unauthorised access,
            misuse or physical damage.
      - id: s17-10.3.3
        class: policy-statement
        title: Clearing of storage media before disposal or re-use
        props:
        - name: label
          value: 10.3.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-10.3.3_smt
          name: statement
          prose: All classified information shall be completely cleared or destroyed from storage media
            before disposal or re-use.
  - id: s17-11
    class: security-area
    title: Access Control
    props:
    - name: label
      value: '11.'
    parts:
    - id: s17-11_ovw
      name: overview
      prose: B/Ds shall prevent unauthorised user access and compromise of information systems and assets
        and allow only authorised computer resources to connect to the government internal network.
    groups:
    - id: s17-11.1
      class: topic
      title: Business Requirements of Access Control
      props:
      - name: label
        value: 11.1.
      controls:
      - id: s17-11.1.1
        class: policy-statement
        title: Least privilege in assigning resources and privileges
        props:
        - name: label
          value: 11.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.1.1_smt
          name: statement
          prose: B/Ds shall enforce the least privilege principle when assigning resources and privileges
            of information systems to users.
      - id: s17-11.1.2
        class: policy-statement
        title: Authorisation of access by information owners
        props:
        - name: label
          value: 11.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.1.2_smt
          name: statement
          prose: Access to information shall not be allowed unless authorised by the relevant information
            owners.
      - id: s17-11.1.3
        class: policy-statement
        title: Logical access control over classified information
        props:
        - name: label
          value: 11.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.1.3_smt
          name: statement
          prose: Access to information systems containing classified information shall be restricted by
            means of logical access control.
      - id: s17-11.1.4
        class: policy-statement
        title: Authentication before access to classified information
        props:
        - name: label
          value: 11.1.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.1.4_smt
          name: statement
          prose: Access to classified information without appropriate authentication shall not be allowed.
    - id: s17-11.2
      class: topic
      title: User Access Management
      props:
      - name: label
        value: 11.2.
      controls:
      - id: s17-11.2.1
        class: policy-statement
        title: Documented user access procedures
        props:
        - name: label
          value: 11.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.2.1_smt
          name: statement
          prose: Procedures for approving, granting and managing user access, including user registration/de-registration,
            password delivery and password reset, shall be documented.
      - id: s17-11.2.2
        class: policy-statement
        title: Need-to-know basis for data access rights
        props:
        - name: label
          value: 11.2.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.2.2_smt
          name: statement
          prose: Data access rights shall be granted to users based on a need-to-know basis.
      - id: s17-11.2.3
        class: policy-statement
        title: Restriction and control of special privileges
        props:
        - name: label
          value: 11.2.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.2.3_smt
          name: statement
          prose: The use of special privileges shall be restricted and controlled.
      - id: s17-11.2.4
        class: policy-statement
        title: Definition and periodic review of access rights
        props:
        - name: label
          value: 11.2.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.2.4_smt
          name: statement
          prose: User privileges and data access rights shall be clearly defined and reviewed periodically.
            The review frequency shall be defined and documented. Records for access rights approval and
            review shall be maintained.
      - id: s17-11.2.5
        class: policy-statement
        title: Revocation of dormant and unneeded access rights
        props:
        - name: label
          value: 11.2.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.2.5_smt
          name: statement
          prose: All user privileges and data access rights shall be revoked after a pre-defined period
            of inactivity or when no longer required. The period of inactivity and the corresponding review
            frequency shall be defined and documented.
      - id: s17-11.2.6
        class: policy-statement
        title: Unique user identities and shared user-IDs
        props:
        - name: label
          value: 11.2.6.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.2.6_smt
          name: statement
          prose: Each user identity (user-ID) shall uniquely identify only one user. Shared or group user-IDs
            shall not be permitted unless explicitly approved by the DITSO.
    - id: s17-11.3
      class: topic
      title: User Responsibilities
      props:
      - name: label
        value: 11.3.
      controls:
      - id: s17-11.3.1
        class: policy-statement
        title: User accountability for user-ID activity
        props:
        - name: label
          value: 11.3.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.3.1_smt
          name: statement
          prose: Users shall be responsible for all activities performed with their user-IDs.
      - id: s17-11.3.2
        class: policy-statement
        title: Password sharing and disclosure
        props:
        - name: label
          value: 11.3.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: should
        parts:
        - id: s17-11.3.2_smt
          name: statement
          prose: Passwords shall not be shared or divulged unless necessary (e.g., helpdesk assistance,
            shared PC and shared files). If passwords must be shared, explicit approval from the DITSO
            shall be obtained. Besides, the shared passwords should be changed promptly when the need
            no longer exists and should be changed frequently if sharing is required on a regular basis.
      - id: s17-11.3.3
        class: policy-statement
        title: Protection of passwords in storage and transmission
        props:
        - name: label
          value: 11.3.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.3.3_smt
          name: statement
          prose: Passwords shall always be well protected when held in storage. Passwords shall be encrypted
            when transmitted over an un-trusted communication network. Compensating controls shall be
            applied to reduce the risk exposure to an acceptable level if encryption is not implementable.
    - id: s17-11.4
      class: topic
      title: System and Application Access Control
      props:
      - name: label
        value: 11.4.
      controls:
      - id: s17-11.4.1
        class: policy-statement
        title: Authentication commensurate with information sensitivity
        props:
        - name: label
          value: 11.4.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.4.1_smt
          name: statement
          prose: Authentication shall be performed in a manner commensurate with the sensitivity of the
            information to be accessed.
      - id: s17-11.4.2
        class: policy-statement
        title: Control of consecutive unsuccessful log-in attempts
        props:
        - name: label
          value: 11.4.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.4.2_smt
          name: statement
          prose: Consecutive unsuccessful log-in trials shall be controlled.
      - id: s17-11.4.3
        class: policy-statement
        title: Departmental password policy
        props:
        - name: label
          value: 11.4.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.4.3_smt
          name: statement
          prose: B/Ds shall define a strict password policy that details at least minimum password length,
            initial assignment, restricted words and format, and password life cycle, and include guidelines
            on suitable systems and user password selection.
      - id: s17-11.4.4
        class: policy-statement
        title: Prohibition on capturing passwords and access mechanisms
        props:
        - name: label
          value: 11.4.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: unqualified
        parts:
        - id: s17-11.4.4_smt
          name: statement
          prose: Staff are prohibited from capturing or otherwise obtaining passwords, decryption keys,
            or any other access control mechanism which could permit unauthorised access.
      - id: s17-11.4.5
        class: policy-statement
        title: Change of vendor-supplied default passwords
        props:
        - name: label
          value: 11.4.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.4.5_smt
          name: statement
          prose: All vendor-supplied default passwords shall be changed before any information system
            is put into operation.
      - id: s17-11.4.6
        class: policy-statement
        title: Change of compromised or disclosed passwords
        props:
        - name: label
          value: 11.4.6.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.4.6_smt
          name: statement
          prose: All passwords shall be promptly changed if they are suspected of/are being compromised
            or disclosed to vendors for maintenance and support.
    - id: s17-11.5
      class: topic
      title: Mobile Computing and Remote Access
      props:
      - name: label
        value: 11.5.
      controls:
      - id: s17-11.5.1
        class: policy-statement
        title: Usage policy for mobile computing and remote access
        props:
        - name: label
          value: 11.5.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: should
        parts:
        - id: s17-11.5.1_smt
          name: statement
          prose: B/Ds shall define appropriate usage policies and procedures specifying the security requirements
            when using mobile computing and remote access. Appropriate security measures shall be adopted
            to avoid unauthorised access to or disclosure of the information stored and processed by these
            facilities. Authorised users should be briefed on the security threats and accept their security
            responsibilities with explicit acknowledgement.
      - id: s17-11.5.2
        class: policy-statement
        title: Prevention of unauthorised remote access
        props:
        - name: label
          value: 11.5.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.5.2_smt
          name: statement
          prose: Security measures shall be in place to prevent unauthorised remote access to government
            information systems and data.
    - id: s17-11.6
      class: topic
      title: IoT Devices
      props:
      - name: label
        value: 11.6.
      controls:
      - id: s17-11.6.1
        class: policy-statement
        title: Security measures for IoT devices
        props:
        - name: label
          value: 11.6.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.6.1_smt
          name: statement
          prose: B/Ds shall define and implement proper security measures to ensure the security of IoT
            devices and data is commensurate with the classification of the information.
      - id: s17-11.6.2
        class: policy-statement
        title: Application of mobile device requirements to IoT devices
        props:
        - name: label
          value: 11.6.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-11.6.2_smt
          name: statement
          prose: The security requirements for mobile devices laid out in this document shall be followed
            similarly for IoT devices unless it is not technically feasible for implementation. Classified
            information shall not be stored or processed in privately-owned IoT devices.
  - id: s17-12
    class: security-area
    title: Cryptography
    props:
    - name: label
      value: '12.'
    parts:
    - id: s17-12_ovw
      name: overview
      prose: B/Ds shall ensure proper and effective use of cryptography to protect the confidentiality,
        authenticity and integrity of information.
    groups:
    - id: s17-12.1
      class: topic
      title: Cryptographic Controls
      props:
      - name: label
        value: 12.1.
      controls:
      - id: s17-12.1.1
        class: policy-statement
        title: Cryptographic key life cycle management
        props:
        - name: label
          value: 12.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-12.1.1_smt
          name: statement
          prose: B/Ds shall manage cryptographic keys through their whole life cycle, including generating,
            storing, archiving, retrieving, distributing, retiring and destroying keys.
  - id: s17-13
    class: security-area
    title: Physical and Environmental Security
    props:
    - name: label
      value: '13.'
    parts:
    - id: s17-13_ovw
      name: overview
      prose: B/Ds shall prevent unauthorised physical access, damage, theft or compromise of assets, and
        interruption to the office premises and information systems.
    groups:
    - id: s17-13.1
      class: topic
      title: Secure Areas
      props:
      - name: label
        value: 13.1.
      controls:
      - id: s17-13.1.1
        class: policy-statement
        title: Site selection and accommodation planning
        props:
        - name: label
          value: 13.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: should
        parts:
        - id: s17-13.1.1_smt
          name: statement
          prose: Careful site selection and accommodation planning of a purpose-built computer installation
            shall be conducted. Reference to the security specifications for construction of special installation
            or office as standard should be made.
      - id: s17-13.1.2
        class: policy-statement
        title: Physical security of data centres and computer rooms
        props:
        - name: label
          value: 13.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.1.2_smt
          name: statement
          prose: Data centres and computer rooms shall have good physical security and strong protection
            from disaster and security threats, whether natural or caused by other reasons, in order to
            minimise the extent of loss and disruption.
      - id: s17-13.1.3
        class: policy-statement
        title: Government physical security requirements by classification
        props:
        - name: label
          value: 13.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.1.3_smt
          name: statement
          prose: Data centres and computer rooms shall comply with the relevant government requirements
            on physical security according to the classification of the information system housed.
      - id: s17-13.1.4
        class: policy-statement
        title: Authorised access list for restricted computing areas
        props:
        - name: label
          value: 13.1.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.1.4_smt
          name: statement
          prose: A list of persons who are authorised to gain access to data centres, computer rooms or
            other areas supporting critical activities, where computer equipment and data are located
            or stored, shall be kept up-to-date and be reviewed periodically.
      - id: s17-13.1.5
        class: policy-statement
        title: Securing of access keys, cards and entry credentials
        props:
        - name: label
          value: 13.1.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.1.5_smt
          name: statement
          prose: All access keys, cards, passwords, etc., for entry to any of the information systems
            and networks shall be physically secured or subject to well-defined and strictly enforced
            security procedures.
      - id: s17-13.1.6
        class: policy-statement
        title: Supervision and recording of visitors
        props:
        - name: label
          value: 13.1.6.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.1.6_smt
          name: statement
          prose: All visitors to data centres or computer rooms shall be monitored at all times by authorised
            staff. A visitor access record shall be kept and properly maintained for audit purposes.
      - id: s17-13.1.7
        class: policy-statement
        title: Security of offices
        props:
        - name: label
          value: 13.1.7.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: should
        parts:
        - id: s17-13.1.7_smt
          name: statement
          prose: All staff shall ensure the security of their offices. Offices that can be directly accessed
            from public areas and contain information systems or information assets should be locked up
            when not in use or after office hours.
    - id: s17-13.2
      class: topic
      title: Equipment
      props:
      - name: label
        value: 13.2.
      controls:
      - id: s17-13.2.1
        class: policy-statement
        title: Secure placement and inspection of information systems
        props:
        - name: label
          value: 13.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.2.1_smt
          name: statement
          prose: All information systems shall be placed in a secure environment or attended by staff
            to prevent unauthorised access. Regular inspection of equipment and communication facilities
            shall be performed to ensure continuous availability and failure detection.
      - id: s17-13.2.2
        class: policy-statement
        title: Safeguarding of mobile devices and removable media
        props:
        - name: label
          value: 13.2.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.2.2_smt
          name: statement
          prose: Staff in possession of mobile devices or removable media for business purposes shall
            safeguard the equipment in his/her possession and shall not leave the equipment unattended
            without proper security measures.
      - id: s17-13.2.3
        class: policy-statement
        title: Removal of IT equipment from sites
        props:
        - name: label
          value: 13.2.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.2.3_smt
          name: statement
          prose: IT equipment shall not be taken away from sites without proper control.
      - id: s17-13.2.4
        class: policy-statement
        title: Session termination and re-authentication on inactivity
        props:
        - name: label
          value: 13.2.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.2.4_smt
          name: statement
          prose: If there has been no activity for a pre-defined period of time, to prevent illegal system
            access attempts, re-authentication shall be activated, or the logon session and connection
            shall be terminated. Also, the user workstation shall be switched off, if appropriate, before
            leaving work for the day or before a prolonged period of inactivity.
      - id: s17-13.2.5
        class: policy-statement
        title: Positioning of display screens showing classified information
        props:
        - name: label
          value: 13.2.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-13.2.5_smt
          name: statement
          prose: The display screen of an information system on which classified information can be viewed
            shall be carefully positioned so that unauthorised persons cannot readily view it.
  - id: s17-14
    class: security-area
    title: Operations Security
    props:
    - name: label
      value: '14.'
    parts:
    - id: s17-14_ovw
      name: overview
      prose: B/Ds shall ensure secure operations of information systems, protect the information systems
        from malware, log IT processes and events, monitor suspicious activities, and prevent exploitation
        of technical vulnerabilities.
    groups:
    - id: s17-14.1
      class: topic
      title: Operational Procedures and Responsibilities
      props:
      - name: label
        value: 14.1.
      controls:
      - id: s17-14.1.1
        class: policy-statement
        title: Principle of least functionality
        props:
        - name: label
          value: 14.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.1.1_smt
          name: statement
          prose: B/Ds shall manage information systems using the principle of least functionality with
            all unnecessary services or components removed or restricted.
      - id: s17-14.1.2
        class: policy-statement
        title: Consideration of changes affecting security mechanisms
        props:
        - name: label
          value: 14.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.1.2_smt
          name: statement
          prose: Changes affecting existing security protection mechanisms shall be carefully considered.
      - id: s17-14.1.3
        class: policy-statement
        title: Documented operational and administrative procedures
        props:
        - name: label
          value: 14.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.1.3_smt
          name: statement
          prose: Operational and administrative procedures for information systems shall be properly documented,
            followed, and reviewed periodically.
    - id: s17-14.2
      class: topic
      title: Protection from Malware
      props:
      - name: label
        value: 14.2.
      controls:
      - id: s17-14.2.1
        class: policy-statement
        title: Anti-malware coverage
        props:
        - name: label
          value: 14.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.2.1_smt
          name: statement
          prose: Anti-malware protection shall be enabled on all local area network servers, personal
            computers, mobile devices, and computers connecting to the government internal network via
            a remote access channel.
      - id: s17-14.2.2
        class: policy-statement
        title: Currency of malware definitions and engines
        props:
        - name: label
          value: 14.2.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.2.2_smt
          name: statement
          prose: B/Ds shall protect their information systems from malware. Malware definitions, as well
            as their detection and repair engines, shall be updated regularly and whenever necessary.
      - id: s17-14.2.3
        class: policy-statement
        title: Media and files from unknown sources
        props:
        - name: label
          value: 14.2.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.2.3_smt
          name: statement
          prose: Storage media and files from unknown source or origin shall not be used unless the storage
            media and files have been checked and cleaned for malware.
      - id: s17-14.2.4
        class: policy-statement
        title: Prohibition on introducing malware
        props:
        - name: label
          value: 14.2.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.2.4_smt
          name: statement
          prose: Users shall not intentionally write, generate, copy, propagate, execute or involve in
            introducing malware.
      - id: s17-14.2.5
        class: policy-statement
        title: Software from trustworthy sources only
        props:
        - name: label
          value: 14.2.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.2.5_smt
          name: statement
          prose: Computers and networks shall only run software that comes from trustworthy sources.
      - id: s17-14.2.6
        class: policy-statement
        title: Blocking of non-business websites
        props:
        - name: label
          value: 14.2.6.
        - name: title-source
          value: editorial
        - name: conformance
          value: best-practice
        parts:
        - id: s17-14.2.6_smt
          name: statement
          prose: B/Ds should consider the value versus inconvenience of implementing technologies to block
            non-business websites.
      - id: s17-14.2.7
        class: policy-statement
        title: Screening of downloads from the Internet
        props:
        - name: label
          value: 14.2.7.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.2.7_smt
          name: statement
          prose: All software and files downloaded from the Internet shall be screened and verified with
            an anti-malware solution.
      - id: s17-14.2.8
        class: policy-statement
        title: Execution of mobile code from the Internet
        props:
        - name: label
          value: 14.2.8.
        - name: title-source
          value: editorial
        - name: conformance
          value: best-practice
        parts:
        - id: s17-14.2.8_smt
          name: statement
          prose: Staff should not execute mobile code or software downloaded from the Internet unless
            the code is from a known and trusted source.
    - id: s17-14.3
      class: topic
      title: Backup
      props:
      - name: label
        value: 14.3.
      controls:
      - id: s17-14.3.1
        class: policy-statement
        title: Regular backups
        props:
        - name: label
          value: 14.3.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.3.1_smt
          name: statement
          prose: Backups shall be carried out at regular intervals.
      - id: s17-14.3.2
        class: policy-statement
        title: Backup and recovery policies
        props:
        - name: label
          value: 14.3.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.3.2_smt
          name: statement
          prose: B/Ds shall establish and implement backup and recovery policies for their information
            systems.
      - id: s17-14.3.3
        class: policy-statement
        title: Review of backup activity and restoration testing
        props:
        - name: label
          value: 14.3.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.3.3_smt
          name: statement
          prose: Backup activities shall be reviewed regularly. Backup restoration tests shall be conducted
            regularly. The frequency of backup reviews and restoration tests shall be defined and documented.
      - id: s17-14.3.4
        class: policy-statement
        title: Protection of backup media
        props:
        - name: label
          value: 14.3.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: best-practice
        parts:
        - id: s17-14.3.4_smt
          name: statement
          prose: Backup media should also be protected against unauthorised access, misuse or corruption.
      - id: s17-14.3.5
        class: policy-statement
        title: Offsite and disconnected copies of crucial backups
        props:
        - name: label
          value: 14.3.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.3.5_smt
          name: statement
          prose: Backup media containing business essential and/or crucial information shall be sited
            at a safe distance from the main site in order to avoid damage arising from a disaster at
            the main site. A copy which is disconnected from information systems shall be stored in order
            to avoid corruption of backup data when an information system is compromised.
    - id: s17-14.4
      class: topic
      title: Logging
      props:
      - name: label
        value: 14.4.
      controls:
      - id: s17-14.4.1
        class: policy-statement
        title: Logging policy and retention period
        props:
        - name: label
          value: 14.4.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.4.1_smt
          name: statement
          prose: B/Ds shall define and document policies relating to the logging of activities of information
            systems under their control (including the retention period) according to the business needs
            and data classification.
      - id: s17-14.4.2
        class: policy-statement
        title: Sufficiency of log content for audit
        props:
        - name: label
          value: 14.4.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.4.2_smt
          name: statement
          prose: Any log kept shall provide sufficient information to support comprehensive audits of
            the effectiveness of and compliance with security measures.
      - id: s17-14.4.3
        class: policy-statement
        title: Retention and protection of logs
        props:
        - name: label
          value: 14.4.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.4.3_smt
          name: statement
          prose: Logs shall be retained for a period commensurate with their usefulness as an audit tool.
            During this period, such logs shall be secured such that they cannot be modified and can only
            be read by authorised persons.
      - id: s17-14.4.4
        class: policy-statement
        title: Restriction on profiling users from logs
        props:
        - name: label
          value: 14.4.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.4.4_smt
          name: statement
          prose: Logs shall not be used to profile the activity of a particular user unless it relates
            to a necessary audit activity as approved by a directorate officer.
      - id: s17-14.4.5
        class: policy-statement
        title: Clock synchronisation to a trusted time source
        props:
        - name: label
          value: 14.4.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.4.5_smt
          name: statement
          prose: The clocks of information systems shall be synchronised to a trusted time source.
    - id: s17-14.5
      class: topic
      title: Control of Operational Environment
      props:
      - name: label
        value: 14.5.
      controls:
      - id: s17-14.5.1
        class: policy-statement
        title: Controlled installation of equipment and software
        props:
        - name: label
          value: 14.5.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.5.1_smt
          name: statement
          prose: Installation of all computer equipment and software shall be done under control and audit.
      - id: s17-14.5.2
        class: policy-statement
        title: Change control and change records
        props:
        - name: label
          value: 14.5.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.5.2_smt
          name: statement
          prose: Changes to information systems shall be controlled by the use of change control procedures.
            Change records shall be maintained to keep track of the applied changes.
    - id: s17-14.6
      class: topic
      title: Technical Vulnerability Management
      props:
      - name: label
        value: 14.6.
      controls:
      - id: s17-14.6.1
        class: policy-statement
        title: Vulnerability management process
        props:
        - name: label
          value: 14.6.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.6.1_smt
          name: statement
          prose: B/Ds shall implement vulnerability management processes, which include identifying, evaluating,
            mitigating, and tracking of vulnerabilities of their information systems.
      - id: s17-14.6.2
        class: policy-statement
        title: Risk-based patch management strategy
        props:
        - name: label
          value: 14.6.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.6.2_smt
          name: statement
          prose: Depending on the risk level, B/Ds shall determine the appropriate patch management strategy,
            including patch checking and patching frequency for their information systems. B/Ds shall
            adopt a risk-based approach to determine the patching schedule of each vulnerability by considering
            its potential impact and the possibility of being exploited. All servers and related devices
            deployed in Internet-facing information systems shall be subject to stringent patch management.
      - id: s17-14.6.3
        class: policy-statement
        title: Application of security patches and compensating measures
        props:
        - name: label
          value: 14.6.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.6.3_smt
          name: statement
          prose: B/Ds shall protect their information systems from known vulnerabilities by applying the
            latest security patches recommended by the product vendors according to the patch management
            strategy or implementing other compensating security measures.
      - id: s17-14.6.4
        class: policy-statement
        title: Risk evaluation and testing before patching
        props:
        - name: label
          value: 14.6.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: best-practice
        parts:
        - id: s17-14.6.4_smt
          name: statement
          prose: Before security patches are applied, proper risk evaluation and testing should be conducted
            to minimise the undesirable effects on the information systems.
      - id: s17-14.6.5
        class: policy-statement
        title: Prohibition on unauthorised application software
        props:
        - name: label
          value: 14.6.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.6.5_smt
          name: statement
          prose: No unauthorised application software shall be loaded onto a government information system
            without prior approval from the officer as designated by the B/D.
    - id: s17-14.7
      class: topic
      title: IT Security Threat Management
      props:
      - name: label
        value: 14.7.
      controls:
      - id: s17-14.7.1
        class: policy-statement
        title: Threat identification, detection and monitoring mechanism
        props:
        - name: label
          value: 14.7.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.7.1_smt
          name: statement
          prose: B/Ds shall establish a threat identification, detection and monitoring mechanism and
            review the mechanism regularly to ensure its effectiveness concerning the nature of information
            systems and technology advancements.
      - id: s17-14.7.2
        class: policy-statement
        title: Regular checking of log records and error reporting
        props:
        - name: label
          value: 14.7.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-14.7.2_smt
          name: statement
          prose: Regular checking on log records, especially on system/application where classified information
            is processed/stored, shall be performed, not only on the completeness but also the integrity
            of the log records. All system and application errors which are suspected to be triggered
            as a result of security breaches shall be reported and logged.
  - id: s17-15
    class: security-area
    title: Communications Security
    props:
    - name: label
      value: '15.'
    parts:
    - id: s17-15_ovw
      name: overview
      prose: B/Ds shall ensure the security of the information transferred within the Government and with
        any external parties.
    groups:
    - id: s17-15.1
      class: topic
      title: Network Security Management
      props:
      - name: label
        value: 15.1.
      controls:
      - id: s17-15.1.1
        class: policy-statement
        title: Protection of internal network and configuration information
        props:
        - name: label
          value: 15.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.1.1_smt
          name: statement
          prose: Internal network addresses, configurations and related system or network information
            shall be properly maintained and shall not be publicly released without the approval of the
            concerned B/D.
      - id: s17-15.1.2
        class: policy-statement
        title: Protection of internal networks with external connections
        props:
        - name: label
          value: 15.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.1.2_smt
          name: statement
          prose: All internal networks with connections to other government networks or publicly accessible
            computer networks shall be properly protected.
      - id: s17-15.1.3
        class: policy-statement
        title: Configuration and administration of communication systems
        props:
        - name: label
          value: 15.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.1.3_smt
          name: statement
          prose: Proper configuration and administration of information/communication systems is required
            and shall be reviewed regularly.
      - id: s17-15.1.4
        class: policy-statement
        title: Network segregation into security domains
        props:
        - name: label
          value: 15.1.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.1.4_smt
          name: statement
          prose: B/Ds shall divide their networks into separate network domains to create security boundaries
            and have better control between them.
      - id: s17-15.1.5
        class: policy-statement
        title: Security of inter-network connections
        props:
        - name: label
          value: 15.1.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.1.5_smt
          name: statement
          prose: Connections made to other networks shall not compromise the security of information processed
            at another, and vice versa. B/Ds shall define and implement proper security measures to ensure
            the security level of the departmental information system being connected with another information
            system under the control of another B/D or external party is not downgraded.
      - id: s17-15.1.6
        class: policy-statement
        title: Connection of unauthorised and privately-owned resources
        props:
        - name: label
          value: 15.1.6.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.1.6_smt
          name: statement
          prose: Unauthorised computer resources including those privately-owned shall not be connected
            to government internal network. If there is an operational necessity, approval from the DITSO
            shall be sought. B/Ds shall ensure that such usage of computer resources conforms to the same
            IT security requirements.
      - id: s17-15.1.7
        class: policy-statement
        title: Documentation and control of wireless communications
        props:
        - name: label
          value: 15.1.7.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.1.7_smt
          name: statement
          prose: B/Ds shall document, monitor, and control wireless communications with connection to
            government internal network.
      - id: s17-15.1.8
        class: policy-statement
        title: Authentication and encryption for wireless communications
        props:
        - name: label
          value: 15.1.8.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.1.8_smt
          name: statement
          prose: Proper authentication and encryption security controls shall be employed to protect data
            communication over wireless communications with connection to government internal network.
      - id: s17-15.1.9
        class: policy-statement
        title: Internet access through controlled gateways
        props:
        - name: label
          value: 15.1.9.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: may
        parts:
        - id: s17-15.1.9_smt
          name: statement
          prose: All Internet access shall be either through centrally arranged Internet gateways or B/D’s
            own Internet gateway implemented with secure architecture and proper security measures. In
            circumstances where this is not feasible or having regard to the mode of use, B/Ds may consider
            allowing Internet access through stand-alone machines, provided that there is an approval
            and control mechanism at an appropriate level in the B/Ds.
        - id: s17-15.1.9_note
          name: note
          title: Footnote in the source document
          prose: Such modes of use may include, for example, Internet surfing, electronic message exchange,
            and the use of official, portable computers while on business trip. The relevant stand-alone
            machines must still be protected by any applicable security mechanisms.
      - id: s17-15.1.10
        class: policy-statement
        title: Simultaneous connection to internal and external networks
        props:
        - name: label
          value: 15.1.10.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.1.10_smt
          name: statement
          prose: Staff shall not connect workstations and mobile devices to an external network by means
            of a communication device, such as a dial-up modem, wireless interface, or broadband link,
            if the workstations or mobile devices are simultaneously connected to a government internal
            network, unless with the approval from the DITSO.
    - id: s17-15.2
      class: topic
      title: Information Transfer
      props:
      - name: label
        value: 15.2.
      controls:
      - id: s17-15.2.1
        class: policy-statement
        title: Transmission of information above CONFIDENTIAL
        props:
        - name: label
          value: 15.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.2.1_smt
          name: statement
          prose: Information classified as higher than CONFIDENTIAL shall be transmitted only under encryption
            and inside an isolated LAN approved by the Government Security Officer with the technical
            endorsement of DPO.
      - id: s17-15.2.2
        class: policy-statement
        title: Encryption of CONFIDENTIAL and RESTRICTED information in transit
        props:
        - name: label
          value: 15.2.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: should
        parts:
        - id: s17-15.2.2_smt
          name: statement
          prose: CONFIDENTIAL/RESTRICTED information shall be encrypted when transmitted over an un-trusted
            communication network, and should be encrypted during transmission in any communication network
            as far as practicable.
      - id: s17-15.2.3
        class: policy-statement
        title: Email transmission of classified information
        props:
        - name: label
          value: 15.2.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.2.3_smt
          name: statement
          prose: Email transmission of classified information shall be transmitted only on an information
            system approved by the Government Security Officer subject to the technical endorsement of
            DPO.
      - id: s17-15.2.4
        class: policy-statement
        title: Recording, retention and destruction of email messages
        props:
        - name: label
          value: 15.2.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.2.4_smt
          name: statement
          prose: Systems administrators shall establish and maintain a systematic process for the recording,
            retention, and destruction of electronic mail messages and accompanying logs.
      - id: s17-15.2.5
        class: policy-statement
        title: Protection of internal email address lists
        props:
        - name: label
          value: 15.2.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.2.5_smt
          name: statement
          prose: Internal email address lists containing entries for authorised users or government sites
            shall be properly maintained and protected from unauthorised access and modification.
      - id: s17-15.2.6
        class: policy-statement
        title: Transfer agreements with external parties
        props:
        - name: label
          value: 15.2.6.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-15.2.6_smt
          name: statement
          prose: Agreement on the secure transfer of classified information between B/Ds and external
            parties shall be established and documented.
      - id: s17-15.2.7
        class: policy-statement
        title: Handling of messages from suspicious sources
        props:
        - name: label
          value: 15.2.7.
        - name: title-source
          value: editorial
        - name: conformance
          value: best-practice
        parts:
        - id: s17-15.2.7_smt
          name: statement
          prose: Electronic messages from suspicious sources should not be opened or forwarded.
  - id: s17-16
    class: security-area
    title: System Acquisition, Development and Maintenance
    props:
    - name: label
      value: '16.'
    parts:
    - id: s17-16_ovw
      name: overview
      prose: B/Ds shall ensure that security is an integral part of information systems across the entire
        life cycle and isolate the development, system testing, acceptance testing, and live operation
        environments whenever possible.
    groups:
    - id: s17-16.1
      class: topic
      title: Security Requirements of Information Systems
      props:
      - name: label
        value: 16.1.
      controls:
      - id: s17-16.1.1
        class: policy-statement
        title: Security planning for systems under development
        props:
        - name: label
          value: 16.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-16.1.1_smt
          name: statement
          prose: Security planning and implementation of appropriate security measures and controls for
            systems under development according to the systems’ security requirements shall be included.
    - id: s17-16.2
      class: topic
      title: Security in Development and Support Processes
      props:
      - name: label
        value: 16.2.
      controls:
      - id: s17-16.2.1
        class: policy-statement
        title: Secure development environments
        props:
        - name: label
          value: 16.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-16.2.1_smt
          name: statement
          prose: B/Ds shall establish and appropriately secure development environments for system development
            and integration efforts that cover the entire system development life cycle.
      - id: s17-16.2.2
        class: policy-statement
        title: Protection of documentation and source code
        props:
        - name: label
          value: 16.2.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-16.2.2_smt
          name: statement
          prose: Documentation, program source code and listings of applications shall be properly maintained
            and restricted for access on a need-to-know basis.
      - id: s17-16.2.3
        class: policy-statement
        title: Testing and review of security measures before implementation
        props:
        - name: label
          value: 16.2.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-16.2.3_smt
          name: statement
          prose: Formal testing and review of security measures shall be performed prior to implementation.
      - id: s17-16.2.4
        class: policy-statement
        title: Application integrity and environment separation
        props:
        - name: label
          value: 16.2.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-16.2.4_smt
          name: statement
          prose: The integrity of an application shall be maintained with appropriate security measures
            such as version control mechanism and separation of environments for development, system testing,
            acceptance testing, and live operation.
      - id: s17-16.2.5
        class: policy-statement
        title: Documented change control procedures
        props:
        - name: label
          value: 16.2.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-16.2.5_smt
          name: statement
          prose: Change control procedures for requesting and approving program/system changes shall be
            documented.
      - id: s17-16.2.6
        class: policy-statement
        title: Advising staff of the impact of security changes
        props:
        - name: label
          value: 16.2.6.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-16.2.6_smt
          name: statement
          prose: B/Ds shall ensure that staff are formally advised of the impact of security changes and
            usage on information systems.
      - id: s17-16.2.7
        class: policy-statement
        title: Developer access to classified production information
        props:
        - name: label
          value: 16.2.7.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-16.2.7_smt
          name: statement
          prose: Application development and system support staff shall not be permitted to access classified
            information in the production systems unless approval from Information Owner is obtained.
    - id: s17-16.3
      class: topic
      title: Test Data
      props:
      - name: label
        value: 16.3.
      controls:
      - id: s17-16.3.1
        class: policy-statement
        title: Selection and protection of test data
        props:
        - name: label
          value: 16.3.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-16.3.1_smt
          name: statement
          prose: Test data shall be carefully selected, protected and controlled commensurate with its
            classification. If the use of classified data from production is genuinely required, the process
            shall be reviewed, documented and approved by Information Owner.
  - id: s17-17
    class: security-area
    title: Outsourcing Security
    props:
    - name: label
      value: '17.'
    parts:
    - id: s17-17_ovw
      name: overview
      prose: B/Ds shall ensure the protection of information systems and assets that are accessible by
        external service providers.
    groups:
    - id: s17-17.1
      class: topic
      title: IT Security in Outsourcing Service
      props:
      - name: label
        value: 17.1.
      controls:
      - id: s17-17.1.1
        class: policy-statement
        title: External service provider compliance with departmental policy
        props:
        - name: label
          value: 17.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-17.1.1_smt
          name: statement
          prose: External service providers shall observe and comply with B/Ds’ departmental IT security
            policy and other information security requirements issued by the Government.
      - id: s17-17.1.2
        class: policy-statement
        title: Risk assessment and security requirements for outsourced services
        props:
        - name: label
          value: 17.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-17.1.2_smt
          name: statement
          prose: B/Ds utilising external services or facilities shall identify and assess the risks to
            the government data and business operations. Security measures, service levels and management
            requirements of external services or facilities commensurate with the data classification
            and business requirements shall be documented and implemented. Security responsibilities of
            external service providers shall be defined and agreed upon.
    - id: s17-17.2
      class: topic
      title: Outsourcing Service Delivery Management
      props:
      - name: label
        value: 17.2.
      controls:
      - id: s17-17.2.1
        class: policy-statement
        title: Monitoring and review of external service providers
        props:
        - name: label
          value: 17.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-17.2.1_smt
          name: statement
          prose: B/Ds shall monitor and review with external service providers to ensure that operations
            by external service providers are documented and managed properly. Confidentiality and non-disclosure
            agreements shall be properly managed and reviewed when changes occur that affect the security
            requirement.
      - id: s17-17.2.2
        class: policy-statement
        title: Audit and compliance monitoring rights
        props:
        - name: label
          value: 17.2.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-17.2.2_smt
          name: statement
          prose: B/Ds shall reserve audit and compliance monitoring rights to ensure external service
            providers have implemented sufficient controls on government information systems, facilities
            and data. Alternatively, the external service providers shall provide security audit reports
            periodically to prove the measures put in place are satisfactory.
      - id: s17-17.2.3
        class: policy-statement
        title: Clearance of government data on service termination
        props:
        - name: label
          value: 17.2.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-17.2.3_smt
          name: statement
          prose: B/Ds shall ensure all government data in external services or facilities are cleared
            or destroyed according to government security requirements at the expiry or termination of
            the service or upon request of the Government.
    - id: s17-17.3
      class: topic
      title: Cloud Computing Security
      props:
      - name: label
        value: 17.3.
      controls:
      - id: s17-17.3.1
        class: policy-statement
        title: Restriction on public cloud for RESTRICTED information
        props:
        - name: label
          value: 17.3.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-17.3.1_smt
          name: statement
          prose: Information classified as RESTRICTED or above shall not be stored in or processed by
            public cloud services.
      - id: s17-17.3.2
        class: policy-statement
        title: Shared responsibility with cloud service providers
        props:
        - name: label
          value: 17.3.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-17.3.2_smt
          name: statement
          prose: Before signing an agreement with a cloud service provider, B/Ds shall ensure that the
            shared responsibilities of both parties are clearly defined, documented, and understood.
  - id: s17-18
    class: security-area
    title: Security Incident Management
    props:
    - name: label
      value: '18.'
    parts:
    - id: s17-18_ovw
      name: overview
      prose: B/Ds shall ensure a consistent and effective approach to the management of information security
        incidents.
    groups:
    - id: s17-18.1
      class: topic
      title: Management of Security Incidents and Improvements
      props:
      - name: label
        value: 18.1.
      controls:
      - id: s17-18.1.1
        class: policy-statement
        title: Incident detection and monitoring mechanism
        props:
        - name: label
          value: 18.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-18.1.1_smt
          name: statement
          prose: B/Ds shall establish an incident detection and monitoring mechanism to detect, contain
            and ultimately prevent security incidents.
      - id: s17-18.1.2
        class: policy-statement
        title: Retention of logs and supporting evidence
        props:
        - name: label
          value: 18.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-18.1.2_smt
          name: statement
          prose: B/Ds shall ensure that system logs and other supporting information are retained for
            the proof and tracing of security incidents.
      - id: s17-18.1.3
        class: policy-statement
        title: Security incident response plan
        props:
        - name: label
          value: 18.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-18.1.3_smt
          name: statement
          prose: B/Ds shall establish, document, test and maintain a security incident response plan for
            their information systems.
      - id: s17-18.1.4
        class: policy-statement
        title: Staff awareness of the incident response plan
        props:
        - name: label
          value: 18.1.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-18.1.4_smt
          name: statement
          prose: Staff shall be made aware of the security incident response plan that is in place and
            shall observe and follow it accordingly.
      - id: s17-18.1.5
        class: policy-statement
        title: Reporting of observed and suspected incidents
        props:
        - name: label
          value: 18.1.5.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-18.1.5_smt
          name: statement
          prose: Any observed or suspected security incidents or security problems in information systems
            or services shall be reported immediately to the responsible party and handled according to
            the incident handling procedure.
      - id: s17-18.1.6
        class: policy-statement
        title: Disclosure of incident information
        props:
        - name: label
          value: 18.1.6.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-18.1.6_smt
          name: statement
          prose: Staff shall not disclose information about the individuals, B/Ds or specific systems
            that have suffered from damages caused by computer crimes and computer abuses or the specific
            methods used to exploit certain system vulnerabilities to any people other than those who
            are handling the incident and responsible for the security of such systems, or authorised
            investigators involving in the investigation of the crime or abuse.
  - id: s17-19
    class: security-area
    title: IT Security Aspects of Business Continuity Management
    props:
    - name: label
      value: '19.'
    parts:
    - id: s17-19_ovw
      name: overview
      prose: B/Ds shall ensure the availability of information systems and security considerations embedded
        in disaster recovery plans.
    groups:
    - id: s17-19.1
      class: topic
      title: IT Security Continuity
      props:
      - name: label
        value: 19.1.
      controls:
      - id: s17-19.1.1
        class: policy-statement
        title: Disaster recovery planning and review
        props:
        - name: label
          value: 19.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-19.1.1_smt
          name: statement
          prose: B/Ds shall plan, implement, and regularly review disaster recovery plans to ensure adequate
            security measures under such situations.
    - id: s17-19.2
      class: topic
      title: Resilience
      props:
      - name: label
        value: 19.2.
      controls:
      - id: s17-19.2.1
        class: policy-statement
        title: Resilience to meet availability requirements
        props:
        - name: label
          value: 19.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-19.2.1_smt
          name: statement
          prose: B/Ds shall ensure adequate resilience to meet the availability requirements of IT services
            and facilities.
  - id: s17-20
    class: security-area
    title: Compliance
    props:
    - name: label
      value: '20.'
    parts:
    - id: s17-20_ovw
      name: overview
      prose: B/Ds shall avoid breaches of legal, statutory, regulatory or contractual obligations related
        to security requirements. Security measures shall be implemented and operated in accordance with
        the respective security requirements.
    groups:
    - id: s17-20.1
      class: topic
      title: Compliance with Legal and Contractual Requirements
      props:
      - name: label
        value: 20.1.
      controls:
      - id: s17-20.1.1
        class: policy-statement
        title: Identification of statutory, regulatory and contractual requirements
        props:
        - name: label
          value: 20.1.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-20.1.1_smt
          name: statement
          prose: B/Ds shall identify and document all relevant statutory, regulatory and contractual requirements
            applicable to the operations of each information system.
      - id: s17-20.1.2
        class: policy-statement
        title: Records evidencing compliance
        props:
        - name: label
          value: 20.1.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-20.1.2_smt
          name: statement
          prose: B/Ds shall keep records to evidence compliance with security requirements and support
            audits of effective implementation of corresponding security measures.
      - id: s17-20.1.3
        class: policy-statement
        title: Compliance with government requirements for classified information
        props:
        - name: label
          value: 20.1.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: should
        parts:
        - id: s17-20.1.3_smt
          name: statement
          prose: B/Ds shall comply with relevant government requirements in relation to the security of
            information systems, including, but not limited to, storage, transmission, processing, and
            destruction of classified information. Information without any security classification should
            also be protected from unintentional disclosure.
      - id: s17-20.1.4
        class: policy-statement
        title: Handling of personal data under the Personal Data (Privacy) Ordinance
        props:
        - name: label
          value: 20.1.4.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        - name: advisory-clauses
          value: should may
        links:
        - href: '#61da519c-33af-5e87-b582-aa1c5cef5db9'
          rel: reference
        parts:
        - id: s17-20.1.4_smt
          name: statement
          prose: Personal Data (Privacy) Ordinance (Cap. 486) shall be observed when handling personal
            data. All personal data should be classified as RESTRICTED information or above. Depending
            on the nature and sensitivity of the personal data concerned and the harm that could result
            from unauthorised or accidental access, processing, erasure or other use of the personal data,
            a higher classification and appropriate security measures may be required.
    - id: s17-20.2
      class: topic
      title: Security Reviews
      props:
      - name: label
        value: 20.2.
      controls:
      - id: s17-20.2.1
        class: policy-statement
        title: Security risk assessments and privacy impact assessments
        props:
        - name: label
          value: 20.2.1.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-20.2.1_smt
          name: statement
          prose: Security risk assessments for information systems and production applications as well
            as privacy impact assessments for information systems and production applications involving
            personal data shall be performed at least once every two years. A security risk assessment
            for information systems as well as a privacy impact assessment for information systems involving
            personal data shall also be performed before production rollout and prior to major enhancements
            and changes associated with these systems or applications.
      - id: s17-20.2.2
        class: policy-statement
        title: Audit of information systems
        props:
        - name: label
          value: 20.2.2.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-20.2.2_smt
          name: statement
          prose: Audit on information systems shall be performed at least once every two years to ensure
            the compliance of IT security policies and effective implementation of security measures.
            The selection of auditors and conduct of audits shall ensure objectivity and impartiality
            of the audit process. Auditors shall not audit their own work.
      - id: s17-20.2.3
        class: policy-statement
        title: Control of assessment and audit tooling
        props:
        - name: label
          value: 20.2.3.
        - name: title-source
          value: editorial
        - name: conformance
          value: mandatory
        parts:
        - id: s17-20.2.3_smt
          name: statement
          prose: Use of software and programs for performing security risk assessment or security audit
            shall be restricted and controlled.
